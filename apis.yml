name: BoxGreen
description: >-
  BoxGreen (BoxGreen Pte. Ltd., incorporated 2014 in Singapore) is a Certified B
  Corporation and social enterprise selling all-natural, individually packaged
  healthy snacks direct to consumers and to businesses. Its consumer offering is a
  Shopify-based e-commerce store with build-your-own snack boxes, curated
  collections (nut mixes, crunchies, vegan and gluten-free ranges), gift and party
  packs, and a subscription delivery model; its B2B side covers corporate gifting,
  office pantry supply, and cashless healthy-snack vending machines. Every BoxGreen
  snack is packed in prison by beneficiaries of Singapore's Yellow Ribbon Project to
  build skills and employability. Surfaced as a 500 Global portfolio company, BoxGreen
  publishes no first-party API or developer program; the only machine-readable surface
  on its domain is Shopify's New Customer Accounts OIDC/OAuth discovery.
